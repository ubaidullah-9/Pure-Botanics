<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="50%" stop-color="#FCD34D" />
      <stop offset="100%" stop-color="#D97706" />
    </linearGradient>

    <!-- Emerald Gradient -->
    <linearGradient id="emeraldGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="40%" stop-color="#059669" />
      <stop offset="100%" stop-color="#34D399" />
    </linearGradient>

    <!-- Background Badge Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#0a3326" />
      <stop offset="70%" stop-color="#041a13" />
      <stop offset="100%" stop-color="#020c08" />
    </radialGradient>
  </defs>

  <!-- High-contrast Premium App Badge for Favicon -->
  <rect x="2" y="2" width="96" height="96" rx="28" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5" />
  
  <!-- Outer Apothecary Dotted Ring -->
  <circle cx="50" cy="50" r="41" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="2 3" opacity="0.65" />
  <circle cx="50" cy="50" r="37" stroke="url(#emeraldGrad)" stroke-width="1.5" opacity="0.85" />

  <!-- Mountain Silhouette Base (Gilgit Heritage) -->
  <path d="M26 69 L42 49 L52 59 L62 45 L74 69 Z" fill="#061f17" stroke="url(#goldGrad)" stroke-width="1.2" opacity="0.75" />

  <!-- Central Twin Botanical Leaves (Herbal Sprout - Rosemary & Amla Sprig) -->
  <!-- Left Leaf -->
  <path d="M50 73 C39 60 29 45 35 30 C43 30 50 41 50 73 Z" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="1.5" />
  
  <!-- Left Leaf Vein -->
  <path d="M48 67 C44 54 41 43 38 33" stroke="#FDE68A" stroke-width="1.2" stroke-linecap="round" opacity="0.9" />

  <!-- Right Leaf -->
  <path d="M50 73 C59 58 69 45 65 32 C57 32 50 43 50 73 Z" fill="url(#emeraldGrad)" stroke="#10B981" stroke-width="1.5" opacity="0.95" />

  <!-- Right Leaf Vein -->
  <path d="M52 67 C56 54 59 43 62 35" stroke="#6EE7B7" stroke-width="1" stroke-linecap="round" opacity="0.85" />

  <!-- Crown Solar Pearl / Seed of Life -->
  <circle cx="50" cy="22" r="4.5" fill="url(#goldGrad)" stroke="#FDE68A" stroke-width="1" />

  <!-- Herbal Dew Drops -->
  <circle cx="33" cy="45" r="2" fill="#FDE68A" />
  <circle cx="67" cy="47" r="2" fill="#FDE68A" />
</svg>
